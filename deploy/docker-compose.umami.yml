# Umami (privacy-friendly, cookieless analytics) for spendrip.com and app.spendrip.com, served at stats.spendrip.com.
# Runs beside the SpenDrip API on the shared droplet. Memory is capped at 256 MB (the droplet has 1 GB, shared
# with Giftoria); resize the droplet before raising it. Settings and secrets: /etc/umami.env (root only).
#
#   docker compose -f deploy/docker-compose.umami.yml up -d
name: umami
services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    network_mode: host          # listens on 127.0.0.1:3010 (nginx proxies stats.spendrip.com to it)
    env_file: /etc/umami.env
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3010/api/heartbeat || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
