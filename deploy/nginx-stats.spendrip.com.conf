# stats.spendrip.com -> Umami on 127.0.0.1:3010. certbot adds the TLS block.
server {
    listen 80;
    listen [::]:80;
    server_name stats.spendrip.com;
    client_max_body_size 1m;
    # Events. No X-Forwarded-Proto here: Umami would otherwise re-fetch itself over HTTPS and fail.
    location = /api/k {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The tracker is served under a neutral name; fetch it straight from Umami (its own rewrite would loop over HTTPS).
    location = /k.js {
        proxy_pass http://127.0.0.1:3010/script.js;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
