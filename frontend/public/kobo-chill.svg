<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" role="img" aria-label="Kobo relaxing in a deckchair with sunglasses, a gold chain and a glass of zobo">
  <style>
    .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
    .note{animation:float 3.2s ease-in-out infinite}
    .note.b{animation-delay:1.1s}
    .glint{animation:glint 5s ease-in-out infinite}
    .sun{transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-in-out infinite}
    @keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
    @keyframes float{0%{transform:translateY(6px);opacity:0}25%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
    @keyframes glint{0%,70%,100%{opacity:0}78%{opacity:.9}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    @media (prefers-reduced-motion:reduce){.sway,.note,.glint,.sun{animation:none}.note{opacity:1}}
  </style>
  <defs>
    <linearGradient id="kd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
    <pattern id="stripe" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <rect width="7" height="14" fill="#2436F2"/><rect x="7" width="7" height="14" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- sun and palm -->
  <g class="sun"><circle cx="286" cy="48" r="40" fill="#FFD23F" opacity=".18"/><circle cx="286" cy="48" r="24" fill="#FFD23F"/></g>
  <!-- palm tree -->
  <path d="M52 238 Q34 150 48 58" fill="none" stroke="#B9763C" stroke-width="9" stroke-linecap="round"/>
  <path d="M44 210 l14 -3 M40 180 l14 -3 M38 150 l14 -3 M40 120 l13 -3 M43 90 l12 -3" stroke="#8C5A2B" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#12B283">
    <path d="M48 58 Q84 30 120 52 Q84 46 48 58Z"/>
    <path d="M48 58 Q74 70 92 104 Q70 76 48 58Z"/>
    <path d="M48 58 Q16 34 -6 50 Q22 44 48 58Z"/>
    <path d="M48 58 Q22 70 8 102 Q30 74 48 58Z"/>
    <path d="M48 58 Q52 22 80 8 Q60 30 48 58Z" fill="#0FA376"/>
  </g>
  <circle cx="54" cy="66" r="5" fill="#8C5A2B"/><circle cx="44" cy="68" r="5" fill="#8C5A2B"/>

  <!-- sand -->
  <ellipse cx="170" cy="236" rx="160" ry="11" fill="#F3D9A4" opacity=".7"/>

  <!-- deckchair -->
  <g stroke="#B9763C" stroke-width="5" stroke-linecap="round">
    <line x1="116" y1="122" x2="190" y2="236"/><line x1="160" y1="206" x2="134" y2="236"/><line x1="230" y1="212" x2="242" y2="236"/>
  </g>
  <path d="M152 204 L112 122 Q124 110 142 116 L182 202 Z" fill="url(#stripe)" stroke="#1726C9" stroke-width="2"/>
  <path d="M152 204 L182 202 L236 208 L234 216 L152 212 Z" fill="url(#stripe)" stroke="#1726C9" stroke-width="2"/>

  <!-- Kobo, leaning back -->
  <g class="sway">
    <g transform="translate(124 106) rotate(-22 60 92) scale(.72)">
      <ellipse cx="60" cy="140" rx="32" ry="5" fill="#0B1040" opacity=".12"/>
      <!-- arm behind the head -->
      <path d="M22 100 Q4 84 14 66" fill="none" stroke="#E0A400" stroke-width="6" stroke-linecap="round"/>
      <!-- legs: stretched out and crossed at the ankle -->
      <g fill="none" stroke="#E0A400" stroke-width="7" stroke-linecap="round">
        <path d="M56 132 Q86 150 120 140"/><path d="M68 134 Q94 134 122 150"/>
      </g>
      <ellipse cx="127" cy="139" rx="10" ry="6" fill="#2436F2" transform="rotate(-20 127 139)"/>
      <ellipse cx="129" cy="152" rx="10" ry="6" fill="#1726C9" transform="rotate(15 129 152)"/>
      <path d="M122 136 h6 M124 149 h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <path d="M60 6S14 66 14 92a46 46 0 0 0 92 0C106 66 60 6 60 6z" fill="url(#kd)" stroke="#E0A400" stroke-width="2"/>
      <ellipse cx="40" cy="62" rx="7" ry="12" fill="#fff" opacity=".55" transform="rotate(25 40 62)"/>
      <!-- sunglasses -->
      <rect x="31" y="83" width="26" height="17" rx="7" fill="#0E1233"/>
      <rect x="63" y="83" width="26" height="17" rx="7" fill="#0E1233"/>
      <path d="M57 89 h6 M31 88 l-9 -4 M89 88 l9 -4" stroke="#0E1233" stroke-width="3" stroke-linecap="round"/>
      <path class="glint" d="M36 87 l8 0" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M68 87 l6 0" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".5"/>
      <!-- cheeks and smirk -->
      <ellipse cx="32" cy="108" rx="7" ry="4" fill="#FF4F8B" opacity=".35"/><ellipse cx="88" cy="108" rx="7" ry="4" fill="#FF4F8B" opacity=".35"/>
      <path d="M50 113 q11 9 23 -3" fill="none" stroke="#0E1233" stroke-width="3.5" stroke-linecap="round"/>
      <!-- gold chain -->
      <path d="M30 120 Q60 142 90 120" fill="none" stroke="#E0A400" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.1 6"/>
      <circle cx="60" cy="133" r="8" fill="#FFC400" stroke="#B98500" stroke-width="2"/>
      <text x="60" y="137.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="11" fill="#7A5600">₦</text>
      <!-- arm with a glass of zobo -->
      <path d="M100 106 Q118 104 122 86" fill="none" stroke="#E0A400" stroke-width="6" stroke-linecap="round"/>
      <g transform="rotate(22 124 74)">
        <path d="M112 56 L136 56 L132 90 L116 90 Z" fill="#8E1B3A" stroke="#FFFFFF" stroke-width="2" stroke-opacity=".8"/>
        <rect x="118" y="64" width="7" height="7" rx="1.5" fill="#fff" opacity=".45"/>
        <path d="M130 56 L140 36" stroke="#FF4F8B" stroke-width="3" stroke-linecap="round"/>
        <path d="M108 58 l10 -12 l8 12 z" fill="#FFD23F" stroke="#E0A400" stroke-width="1.5"/>
      </g>
    </g>
  </g>

  <!-- music -->
  <text class="note" x="236" y="104" font-size="24" fill="#2436F2" font-family="Arial,sans-serif">♪</text>
  <text class="note b" x="262" y="122" font-size="20" fill="#FF4F8B" font-family="Arial,sans-serif">♫</text>
</svg>
