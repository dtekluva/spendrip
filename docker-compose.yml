name: spendrip

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql://spendrip:spendrip@db:5432/spendrip
    # Local emails print to the backend log. Set LOCAL_MAILGUN_API_KEY to really send (needs this machine's IP allowed in Mailgun).
    MAILGUN_API_KEY: ${LOCAL_MAILGUN_API_KEY:-}
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spendrip
      POSTGRES_PASSWORD: spendrip
      POSTGRES_DB: spendrip
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendrip"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: python manage.py migrate --noinput

  backend:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: python manage.py run_worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
